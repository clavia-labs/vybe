name: publish

# Release Please keeps a release PR current on main. Merging that PR creates
# the GitHub release and publishes the package through npm trusted publishing.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and package without publishing
        type: boolean
        default: true
      release_ref:
        description: Git ref to publish (defaults to the workflow revision)
        type: string
        default: ""

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      release_ref: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_ref || needs.release-please.outputs.release_ref || github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Publish package
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry-run }}
        run: npm publish --provenance --access public
